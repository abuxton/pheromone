version: '3.8'

# Port assignments (ADR-011):
#   4426 - gRPC Control Plane (AgentRegistry + TwinControl)
#   4427 - gRPC Telemetry Plane (TelemetryStream)
#   443  - HTTPS REST API (Phase 2)
#   80   - HTTP REST API (redirect to 443 in production)
#   2379 - etcd client
#   2380 - etcd peer

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: pheromone-etcd
    environment:
      - ETCD_NAME=etcd0
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    command: 
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name=etcd0
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://0.0.0.0:2380
      - --initial-cluster-token=etcd-cluster
      - --initial-cluster-state=new

  pheromone-nats:
    image: nats:latest
    container_name: pheromone-nats
    ports:
      - "4222:4222"
    command: ["-js"]
    networks:
      - pheromone-network

volumes:
  etcd-data:

networks:
  pheromone-network:
    driver: bridge

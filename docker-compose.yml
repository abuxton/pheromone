version: '3.8'

# Port assignments (ADR-011):
#   4426 - gRPC Control Plane (AgentRegistry + TwinControl)
#   4427 - gRPC Telemetry Plane (TelemetryStream)
#   443  - HTTPS REST API (Phase 2)
#   80   - HTTP REST API (redirect to 443 in production)
#   2379 - etcd client
#   2380 - etcd peer
#   9090 - Prometheus
#   3000 - Grafana

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: pheromone-etcd
    environment:
      - ETCD_NAME=etcd0
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    command: 
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name=etcd0
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://0.0.0.0:2380
      - --initial-cluster-token=etcd-cluster
      - --initial-cluster-state=new

  pheromone-nats:
    image: nats:latest
    container_name: pheromone-nats
    ports:
      - "4222:4222"
    command: ["-js"]
    networks:
      - pheromone-network

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: pheromone-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks:
      - pheromone-network

  grafana:
    image: grafana/grafana:12.0.1
    container_name: pheromone-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - pheromone-network
    depends_on:
      - prometheus

volumes:
  etcd-data:
  grafana-data:

networks:
  pheromone-network:
    driver: bridge

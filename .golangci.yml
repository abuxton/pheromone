version: "2"

run:
  timeout: 5m
  go: "1.25"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    # Bugs
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - bodyclose
    - nilerr
    - rowserrcheck

    # Style
    - revive
    - misspell

    # Complexity
    - gocyclo
    - gocognit
    - funlen

    # Security
    - gosec
    - gocritic

    # Performance
    - prealloc

    # Error handling
    - errorlint
    - wrapcheck

    # Unused code
    - unused
    - unparam

  settings:
    gocyclo:
      # CLI entry-points and validators handle many conditions; raised to avoid false positives.
      min-complexity: 25
    gocognit:
      # Complex validation/test helpers raised to avoid false positives.
      min-complexity: 35
    funlen:
      # Data-seeding and fixture functions exceed 80 lines by design.
      lines: 200
      statements: 100
    gosec:
      excludes:
        - G601  # implicit memory aliasing (fixed in Go 1.22)
        - G104  # unhandled errors — covered by errcheck linter
        - G115  # integer overflow conversions — checked in context
        - G301  # directory permissions — test fixtures use 0755 intentionally
        - G304  # file inclusion via variable — acceptable in test helpers
        - G306  # file permissions — test fixtures use 0644 intentionally
        - G703  # path traversal via taint analysis — test helper with controlled input — test fixtures use 0644 intentionally
    revive:
      rules:
        - name: var-naming
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        # Note: 'exported' stutter check omitted — many existing types use
        # package-qualified names intentionally (e.g. skill.SkillResult).
    wrapcheck: {}
    errcheck:
      # Type assertions via ok-form don't need error checking; sync.Map values
      # are typed at the call site.
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        # Closing files/connections in defer is idiomatic; errors are unactionable.
        - "(*os.File).Close"
        - "(net.Listener).Close"
        - "(*net.TCPListener).Close"
        - "(io.ReadCloser).Close"
        - "(io.Closer).Close"

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - wrapcheck
        - funlen
        - gocognit
        - gocyclo
        - gocritic
    - path: benchmark/
      linters:
        - gosec
        - wrapcheck
        - errcheck
        - errorlint
        - gocognit
        - unparam
  max-issues-per-linter: 50
  max-same-issues: 10

syntax = "proto3";

package pheromone.v1;

option go_package = "github.com/abuxton/pheromone/internal/proto/pheromone/v1;pheromone_v1";

// TelemetryStream provides bidirectional streaming of metrics, logs, and AI decision
// traces from agent to server (ADR-003, ADR-007).
service TelemetryStream {
  // StreamMetrics is a bidirectional stream: the agent continuously emits metric/log/trace
  // batches; the server acknowledges receipt and applies backpressure when needed.
  rpc StreamMetrics(stream MetricsRequest) returns (stream MetricsResponse);
}

// Metric represents a single metric observation in OpenMetrics format.
message Metric {
  // name is the metric name, e.g. "cpu_usage_percent".
  string name = 1;

  // value is the numeric measurement.
  double value = 2;

  // labels contains key-value pairs used to identify the metric source.
  map<string, string> labels = 3;

  // timestamp_unix_ms is the observation time in milliseconds since the Unix epoch.
  int64 timestamp_unix_ms = 4;
}

// LogEntry represents a single structured log record.
message LogEntry {
  // level is the log severity, e.g. "info", "warn", "error".
  string level = 1;

  // message is the human-readable log text.
  string message = 2;

  // fields contains structured key-value context for the log entry.
  map<string, string> fields = 3;

  // timestamp_unix_ms is the time the log entry was emitted, in milliseconds since the Unix epoch.
  int64 timestamp_unix_ms = 4;
}

// AIDecisionTrace captures one iteration of the agent's AI reasoning loop (ADR-007).
message AIDecisionTrace {
  // trace_id correlates this trace with the corresponding TelemetryStream trace_id.
  string trace_id = 1;

  // timestamp_unix_ms is the time the reasoning iteration completed, in milliseconds.
  int64 timestamp_unix_ms = 2;

  // observations_count is the number of observations (metrics, logs, twin reads) ingested.
  int32 observations_count = 3;

  // drift_detected is true when the reasoner identified a gap between desired and actual state.
  bool drift_detected = 4;

  // actions_planned is the number of actions generated by the reasoning step.
  int32 actions_planned = 5;

  // actions_executed is the number of actions successfully executed.
  int32 actions_executed = 6;

  // actions_proposed is the number of actions submitted to the server for approval via ProposeAction.
  int32 actions_proposed = 7;

  // twin_updates lists the twin IDs whose state was updated during this reasoning iteration.
  repeated string twin_updates = 8;
}

// MetricsRequest is streamed by the agent to deliver metric/log/trace batches.
message MetricsRequest {
  // agent_id identifies the sending agent.
  string agent_id = 1;

  // trace_id is the distributed trace identifier for this batch.
  string trace_id = 2;

  // metrics contains the metric observations to be delivered.
  repeated Metric metrics = 3;

  // logs contains the structured log entries to be delivered.
  repeated LogEntry logs = 4;

  // ai_traces contains AI reasoning loop decision traces (ADR-007).
  repeated AIDecisionTrace ai_traces = 5;
}

// MetricsResponse is streamed by the server to acknowledge receipt and signal backpressure.
message MetricsResponse {
  // server_id is the unique identifier of the responding server instance.
  string server_id = 1;

  // acked_count is the total number of metric observations received in the last batch.
  int32 acked_count = 2;

  // ready_for_next signals whether the server is ready to receive the next batch.
  // When false, the agent should pause before sending additional data (backpressure).
  bool ready_for_next = 3;
}
